name: esp_tools_workspace
description: Dart/Flutter tooling for Espressif chips — esptool protocol, idftool port, and web apps.
publish_to: none

environment:
  sdk: ^3.6.0

workspace:
  - packages/esp_monitor
  - packages/esptool
  - packages/esptool_libserialport
  - packages/idftool
  - packages/littlefs
  - packages/spiffs
  - packages/fatfs
  - apps/idftool_web
